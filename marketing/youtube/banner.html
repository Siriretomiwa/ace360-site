<!doctype html>
<!-- Ace 360 YouTube channel art, 2560×1440. Everything important sits inside the
     1546×423 safe area (centre); the sample sites at the sides show on desktop and TV.
     Render: node render-banner.js  →  ace360-youtube-banner.png (+ a safe-area check image) -->
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<title>Ace 360 YouTube banner</title>
<style>
@font-face{font-family:"Inter Variable";font-weight:100 900;src:url(../../wordpress-theme/ace360/assets/fonts/inter-latin-wght-normal.woff2) format("woff2-variations")}
@font-face{font-family:"JetBrains Mono Variable";font-weight:100 800;src:url(../../wordpress-theme/ace360/assets/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2-variations")}
@font-face{font-family:"EB Garamond";font-style:italic;font-weight:400;src:url(../../wordpress-theme/ace360/assets/fonts/eb-garamond-latin-400-italic.woff2) format("woff2")}
html,body{margin:0;background:#0d0a08}
#art{position:relative;width:2560px;height:1440px;overflow:hidden;font-family:"Inter Variable",sans-serif;color:#f4efe9;
  background:radial-gradient(38% 46% at 50% 50%,rgba(255,106,0,.30),rgba(255,106,0,0) 70%),radial-gradient(70% 60% at 50% 50%,#2a1408 0%,#0d0a08 72%)}
#art::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(244,239,233,.035) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,rgba(244,239,233,.035) 1px,transparent 1px) 0 0/64px 64px;-webkit-mask-image:radial-gradient(60% 60% at 50% 50%,#000 30%,transparent 80%);mask-image:radial-gradient(60% 60% at 50% 50%,#000 30%,transparent 80%)}
#grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay}
.card{position:absolute;width:620px;height:388px;border-radius:18px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.06);}
.card canvas{display:block;width:100%;height:100%}
.card.dim{filter:brightness(.55) saturate(.9)}
/* safe area 1546×423 centred: x 507–2053, y 508–931 */
.safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;gap:56px;padding:0 40px;box-sizing:border-box}
.ring{flex:none;width:250px;height:250px;filter:drop-shadow(0 0 40px rgba(255,106,0,.55))}
.copy{display:grid;gap:14px;flex:1}
.name{display:flex;align-items:baseline;gap:22px}
.name b{font-size:150px;font-weight:800;letter-spacing:-.045em;line-height:.9}
.name small{font:600 30px/1 "JetBrains Mono Variable",monospace;letter-spacing:.42em;color:#b9b0a6;text-transform:uppercase}
.line{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.line em{font-family:"EB Garamond",serif;font-style:italic;font-weight:400;color:#ff8f45;font-size:1.12em}
.meta{display:flex;align-items:center;gap:22px;margin-top:8px;font:600 26px/1 "JetBrains Mono Variable",monospace;color:#b9b0a6;letter-spacing:.04em}
.meta .pill{padding:14px 22px;border-radius:999px;background:#ff6a00;color:#111;font-family:"Inter Variable",sans-serif;font-weight:800;letter-spacing:-.01em;box-shadow:0 0 50px rgba(255,106,0,.45)}
.meta .dot{width:10px;height:10px;border-radius:50%;background:#ff6a00}
.side{flex:none;display:grid;gap:12px;justify-items:end;text-align:right}
.side span{font:600 24px/1.2 "JetBrains Mono Variable",monospace;color:#b9b0a6;letter-spacing:.06em}
.side b{font-size:34px;font-weight:700;letter-spacing:-.02em}
.guide{position:absolute;left:507px;top:508px;width:1546px;height:423px;outline:4px dashed #22c55e;display:none}
.guide.d{left:0;width:2560px;outline-color:#38bdf8}
body.check .guide{display:block}
</style>
</head>
<body>
<div id="art">
  <canvas id="grain" width="640" height="360"></canvas>
  <!-- left side (desktop + TV) -->
  <div class="card dim" style="left:-150px;top:150px;transform:rotate(-8deg)"><canvas width="1024" height="640" data-kind="zout"></canvas></div>
  <div class="card" style="left:-215px;top:560px;transform:rotate(-4deg)"><canvas width="1024" height="640" data-kind="korrel"></canvas></div>
  <div class="card dim" style="left:-120px;top:980px;transform:rotate(5deg)"><canvas width="1024" height="640" data-kind="noor"></canvas></div>
  <!-- right side -->
  <div class="card dim" style="right:-140px;top:120px;transform:rotate(7deg)"><canvas width="1024" height="640" data-kind="molen"></canvas></div>
  <div class="card" style="right:-215px;top:540px;transform:rotate(4deg)"><canvas width="1024" height="640" data-kind="culpromark"></canvas></div>
  <div class="card dim" style="right:-150px;top:990px;transform:rotate(-6deg)"><canvas width="1024" height="640" data-kind="sidwalk"></canvas></div>

  <div class="safe">
    <svg class="ring" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="#ff6a00" stroke-width="2.6" stroke-dasharray="5.2 2.34" stroke-dashoffset="6.37"/><rect x="13" y="1.5" width="6" height="6" rx="1" fill="#ff6a00"/></svg>
    <div class="copy">
      <div class="name"><b>Ace 360</b><small>Services</small></div>
      <p class="line">Websites that <em>earn</em>, while you sleep.</p>
      <p class="meta"><span class="pill">Book a free call →</span><span>ace360services.nl</span></p>
    </div>
    <div class="side">
      <span>NEW VIDEOS</span>
      <b>Mon · Wed · Fri</b>
      <span>NL &amp; WORLDWIDE</span>
    </div>
  </div>
  <div class="guide d" style="top:508px;height:423px"></div>
  <div class="guide"></div>
</div>
<script src="../../wordpress-theme/ace360/assets/js/screens.js"></script>
<script>
  // paint the sample sites and a little film grain
  window.BANNER_READY = (async function () {
    await document.fonts.ready;
    var P = window.ACE360_PAINT;
    var paintAll = function () { document.querySelectorAll('canvas[data-kind]').forEach(function (c) { P.paint(c, c.getAttribute('data-kind'), ''); }); };
    paintAll();
    await new Promise(function (r) { if (P.onPhotos) P.onPhotos(function () { paintAll(); r(); }); setTimeout(r, 4000); });
    var g = document.getElementById('grain').getContext('2d'), d = g.createImageData(640, 360);
    for (var i = 0; i < d.data.length; i += 4) { var v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    g.putImageData(d, 0, 0);
    return true;
  })();
</script>
</body>
</html>
