<!doctype html>
<!--
  Ace 360 · Reel 01 "While you slept" (9:16, 1080×1920).
  Every frame is a pure function of time: window.REEL.draw(t) paints the
  reel canvas at second t, so render.js can step through it frame by frame.
  It reuses the website's own screens: the hero story (film.js) and the
  sample sites with their product photos (screens.js).
-->
<html lang="en" data-lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<title>Ace 360 · Reel 01</title>
<style>
@font-face{font-family:"Inter Variable";font-weight:100 900;src:url(../../../wordpress-theme/ace360/assets/fonts/inter-latin-wght-normal.woff2) format("woff2-variations")}
@font-face{font-family:"JetBrains Mono Variable";font-weight:100 800;src:url(../../../wordpress-theme/ace360/assets/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2-variations")}
@font-face{font-family:"EB Garamond";font-style:italic;font-weight:400;src:url(../../../wordpress-theme/ace360/assets/fonts/eb-garamond-latin-400-italic.woff2) format("woff2")}
html,body{margin:0;background:#000}
#reel{display:block;width:1080px;height:1920px}
#stage{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0}
</style>
</head>
<body>
<canvas id="reel" width="1080" height="1920"></canvas>
<canvas id="stage"></canvas>
<script>
  // the site's 3D film is only used for its story painter: keep its render loop from ever starting
  window.__raf = window.requestAnimationFrame; window.requestAnimationFrame = function () { return 0; };
</script>
<script src="../../../wordpress-theme/ace360/assets/vendor/three.min.js"></script>
<script src="../../../wordpress-theme/ace360/assets/js/screens.js"></script>
<script src="../../../wordpress-theme/ace360/assets/js/film.js"></script>
<script>
(function () {
  'use strict';
  var W = 1080, H = 1920;
  var cv = document.getElementById('reel'), g = cv.getContext('2d');
  var P = window.ACE360_PAINT, FILM = window.ACE360_FILM;
  var SANS = '"Inter Variable", Inter, system-ui, sans-serif', SERIF = '"EB Garamond", Georgia, serif', MONO = '"JetBrains Mono Variable", monospace';
  var OR = '#ff6a00', ORL = '#ff8a3d', CREAM = '#f4efe9', MUTED = 'rgba(244,239,233,0.62)', NIGHT = '#0d0a08';

  /* ---------- helpers ---------- */
  function c01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(x) { x = c01(x); return 1 - Math.pow(1 - x, 3); }
  function inOut(x) { x = c01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function seg(t, a, b) { return c01((t - a) / (b - a)); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  // a line of text where *word* is set in the orange serif italic (the site's accent)
  function rich(str, cx, y, size, color, align) {
    var parts = str.split('*'), widths = [], total = 0;
    parts.forEach(function (p, i) { g.font = (i % 2 ? '400 italic ' + Math.round(size * 1.12) + 'px ' + SERIF : '700 ' + size + 'px ' + SANS); var w = g.measureText(p).width; widths.push(w); total += w; });
    var x = align === 'left' ? cx : cx - total / 2;
    g.textBaseline = 'alphabetic'; g.textAlign = 'left';
    parts.forEach(function (p, i) {
      g.font = (i % 2 ? '400 italic ' + Math.round(size * 1.12) + 'px ' + SERIF : '700 ' + size + 'px ' + SANS);
      g.fillStyle = i % 2 ? ORL : color; g.fillText(p, x, y); x += widths[i];
    });
  }
  // lines rise in one by one
  function headline(lines, cx, y0, size, t0, t, gap, align) {
    lines.forEach(function (l, i) {
      var k = ease(seg(t, t0 + i * 0.12, t0 + i * 0.12 + 0.55));
      if (k <= 0) return;
      g.save(); g.globalAlpha *= k; g.translate(0, (1 - k) * 40);
      rich(l, cx, y0 + i * (gap || size * 1.12), size, CREAM, align); g.restore();
    });
  }
  function kicker(text, x, y, a) { g.save(); g.globalAlpha *= a; g.fillStyle = OR; g.fillRect(x, y - 16, 14, 14); g.font = '600 26px ' + MONO; g.fillStyle = MUTED; g.textAlign = 'left'; g.fillText(text.toUpperCase().split('').join(' '), x + 28, y - 3); g.restore(); }
  function logoRing(cx, cy, r, draw, lw) {
    g.save(); g.strokeStyle = OR; g.lineWidth = lw || r * 0.2; g.setLineDash([r * 0.43, r * 0.195]);
    g.beginPath(); g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * c01(draw)); g.stroke(); g.setLineDash([]);
    if (draw > 0.9) { var s = r * 0.5 * ease(seg(draw, 0.9, 1)); g.fillStyle = OR; rr(cx - s / 2, cy - r - s / 2, s, s, s * 0.15); g.fill(); }
    g.restore();
  }

  /* ---------- background: warm dark, slow drifting light ---------- */
  var grain = document.createElement('canvas'); grain.width = grain.height = 256;
  (function () { var gg = grain.getContext('2d'), d = gg.createImageData(256, 256), s = 7; for (var i = 0; i < d.data.length; i += 4) { s = (s * 16807) % 2147483647; var v = (s % 255); d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 18; } gg.putImageData(d, 0, 0); })();
  function background(t) {
    g.fillStyle = NIGHT; g.fillRect(0, 0, W, H);
    [[0.75 + Math.sin(t * 0.3) * 0.08, 0.3 + Math.cos(t * 0.25) * 0.05, 900, 'rgba(255,110,20,0.42)'], [0.15, 0.85 + Math.sin(t * 0.2) * 0.04, 800, 'rgba(255,90,10,0.25)'], [0.1, 0.05, 700, 'rgba(255,200,140,0.14)']].forEach(function (b) {
      var gr = g.createRadialGradient(b[0] * W, b[1] * H, 0, b[0] * W, b[1] * H, b[2]); gr.addColorStop(0, b[3]); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    });
    g.save(); g.globalCompositeOperation = 'overlay'; g.fillStyle = g.createPattern(grain, 'repeat'); g.fillRect(0, 0, W, H); g.restore();
  }
  // dust specks drifting in the light
  var specks = []; (function () { var s = 3; function r() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; } for (var i = 0; i < 70; i++) specks.push([r(), r(), 1 + r() * 2.5, 0.2 + r() * 0.6, r() * 6]); })();
  function dust(t) { specks.forEach(function (p) { var y = ((p[1] - t * 0.012 * p[3]) % 1 + 1) % 1; g.fillStyle = 'rgba(255,190,130,' + (0.25 + 0.35 * Math.sin(t * p[3] + p[4]) ** 2) + ')'; g.beginPath(); g.arc(p[0] * W + Math.sin(t * 0.4 + p[4]) * 20, y * H, p[2], 0, 7); g.fill(); }); }

  /* ---------- the browser window that shows the site ---------- */
  var scr = document.createElement('canvas'); scr.width = 1024; scr.height = 640;
  function windowCard(x, y, w, src, a, scale) {
    var h = w * 640 / 1024; scale = scale || 1;
    g.save(); g.globalAlpha *= a;
    g.translate(x + w / 2, y + h / 2); g.scale(scale, scale); g.translate(-w / 2, -h / 2);
    g.shadowColor = 'rgba(255,110,20,0.35)'; g.shadowBlur = 90; g.shadowOffsetY = 30; rr(0, 0, w, h, 26); g.fillStyle = '#000'; g.fill(); g.shadowColor = 'transparent';
    g.save(); rr(0, 0, w, h, 26); g.clip(); g.drawImage(src, 0, 0, w, h); g.restore();
    g.strokeStyle = 'rgba(255,200,150,0.25)'; g.lineWidth = 2; rr(0, 0, w, h, 26); g.stroke();
    g.restore();
    return h;
  }
  function notification(x, y, title, sub, a, scale) {
    g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(scale || 1, scale || 1);
    g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 50; g.shadowOffsetY = 20;
    rr(-430, -78, 860, 156, 40); g.fillStyle = 'rgba(250,246,240,0.96)'; g.fill(); g.shadowColor = 'transparent';
    rr(-398, -46, 92, 92, 22); g.fillStyle = OR; g.fill();
    g.fillStyle = '#111'; g.font = '800 52px ' + SANS; g.textAlign = 'center'; g.fillText('€', -352, 18);
    g.textAlign = 'left'; g.font = '700 38px ' + SANS; g.fillText(title, -280, -8);
    g.font = '500 30px ' + SANS; g.fillStyle = '#4a4d52'; g.fillText(sub, -280, 38);
    g.font = '500 26px ' + SANS; g.fillStyle = '#8a8e95'; g.textAlign = 'right'; g.fillText('now', 398, -12);
    g.restore();
  }

  /* ---------- scenes ---------- */
  var SECTORS = [['korrel', 'warm', 'Bakery', '€2,900 – €3,600'], ['noor', 'bold', 'Hair salon', '€1,700 – €2,300'], ['zout', 'warm', 'Restaurant', '€1,700 – €2,300'], ['molen', 'calm', 'Online store', '€3,200 – €4,050'], ['voedselbrug', 'warm', 'Charity', '€1,700 – €2,300'], ['adem', 'bold', 'Yoga studio', '€1,700 – €2,300']];
  var STEPS = [[2.4, 4.9, '1 · They *search*.'], [4.9, 8.4, '2 · Your page *sells*.'], [8.4, 10.4, '3 · They pay in *one tap*.'], [10.4, 13.6, '4 · You wake up to *orders*.']];
  var T_END = 25;

  function draw(t) {
    background(t); dust(t);
    g.textAlign = 'left'; g.globalAlpha = 1;

    // 0 · hook (0 – 2.6)
    if (t < 2.9) {
      var out = 1 - seg(t, 2.4, 2.9);
      g.save(); g.globalAlpha = out;
      kicker('POV', 90, 560, ease(seg(t, 0, 0.3)));
      headline(['It’s *23:14*.', 'Your website just', 'took an order.'], 90, 690, 104, 0.05, t, 118, 'left');
      var n = ease(seg(t, 0.75, 1.2)), shake = t > 0.75 && t < 1.25 ? Math.sin(t * 90) * 10 * (1 - seg(t, 0.75, 1.25)) : 0;
      notification(540 + shake, lerp(260, 1220, n), 'New order #1043 · €29.80', 'Bakkerij Korrel · paid with iDEAL', n, 1);
      g.restore();
    }

    // 1 · how a website earns: the site's hero story (2.4 – 13.6)
    if (t > 2.4 && t < 14) {
      var a = ease(seg(t, 2.4, 2.9)) * (1 - seg(t, 13.6, 14));
      FILM.storyAt(scr, Math.min(10.95, (t - 2.4)));
      kicker('How a website earns', 90, 380, a);
      STEPS.forEach(function (s) {
        if (t < s[0] || t > s[1]) return;
        var k = ease(seg(t, s[0] + 0.12, s[0] + 0.5)) * (s[1] > 13 ? 1 : 1 - seg(t, s[1] - 0.22, s[1]));
        g.save(); g.globalAlpha = a * k; g.translate(0, (1 - k) * 30); rich(s[2], 90, 520, 74, CREAM, 'left'); g.restore();
      });
      windowCard(40, 690, 1000, scr, a, lerp(0.94, 1, ease(seg(t, 2.4, 3.2))));
      // progress dots
      for (var i = 0; i < 4; i++) { var on = t >= STEPS[i][0]; g.globalAlpha = a; g.fillStyle = on ? OR : 'rgba(255,255,255,0.2)'; rr(90 + i * 70, 1390, on && t < STEPS[i][1] ? 56 : 40, 8, 4); g.fill(); }
      g.globalAlpha = 1;
    }

    // 2 · any business, one tap (13.6 – 18.4)
    if (t > 13.6 && t < 18.8) {
      var b = ease(seg(t, 13.6, 14.1)) * (1 - seg(t, 18.4, 18.8));
      kicker('Any business', 90, 380, b);
      g.save(); g.globalAlpha = b; rich('One idea. *Your* website.', 90, 520, 74, CREAM, 'left'); g.restore();
      var idx = Math.min(SECTORS.length - 1, Math.floor((t - 13.9) / 0.75)), local = (t - 13.9) - idx * 0.75;
      if (idx < 0) { idx = 0; local = 0; }
      var sct = SECTORS[idx];
      var sg = scr.getContext('2d'); sg.clearRect(0, 0, 1024, 640); P.screenMood(sct[0], sct[1], sg, 1024, 640);
      windowCard(40, 690, 1000, scr, b, 1 + 0.03 * (1 - ease(local / 0.3)));
      // the orange scan line that "rebuilds" the page
      if (local < 0.28 && t > 14) { var sx = 40 + 1000 * (local / 0.28); g.save(); g.globalAlpha = b; g.fillStyle = OR; g.fillRect(sx - 4, 690, 8, 625); g.restore(); }
      g.save(); g.globalAlpha = b;
      g.font = '700 54px ' + SANS; g.fillStyle = CREAM; g.fillText(sct[2], 90, 1440);
      g.font = '600 38px ' + MONO; g.fillStyle = ORL; g.fillText(sct[3], 90, 1500);
      g.restore();
    }

    // 3 · the promise: the price before the call (18.4 – 21.8)
    if (t > 18.4 && t < 22.2) {
      var c = ease(seg(t, 18.4, 18.9)) * (1 - seg(t, 21.8, 22.2));
      g.save(); g.globalAlpha = c;
      kicker('Our promise', 90, 380, 1);
      headline(['You know the *price*', 'before we even talk.'], 90, 520, 84, 18.45, t, 100, 'left');
      var f = inOut(seg(t, 18.9, 20.4)), cx = 540, cy = 1030, R = 250;
      g.lineWidth = 34; g.strokeStyle = 'rgba(255,255,255,0.08)'; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke();
      g.strokeStyle = OR; g.lineCap = 'round'; g.shadowColor = 'rgba(255,110,20,0.8)'; g.shadowBlur = 40;
      g.beginPath(); g.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * 0.58 * f); g.stroke(); g.shadowColor = 'transparent'; g.lineCap = 'butt';
      var lo = Math.round(1200 * (0.45 + 0.55 * f) / 10) * 10, hi = Math.round(1600 * (0.45 + 0.55 * f) / 10) * 10;
      g.textAlign = 'center'; g.fillStyle = MUTED; g.font = '600 28px ' + MONO; g.fillText('YOUR PRICE', cx, cy - 60);
      g.fillStyle = CREAM; g.font = '800 66px ' + SANS; g.fillText('€' + lo.toLocaleString('en-GB') + ' – €' + hi.toLocaleString('en-GB'), cx, cy + 20);
      g.fillStyle = MUTED; g.font = '500 30px ' + SANS; g.fillText('5-page website · excl. VAT', cx, cy + 74);
      var m = ease(seg(t, 20.3, 20.8));
      g.globalAlpha = c * m; g.font = '700 46px ' + SANS; g.fillStyle = CREAM; g.fillText('Live in 3–4 weeks. Fixed in the quote.', cx, 1400);
      g.restore(); g.textAlign = 'left';
    }

    // 4 · end card (21.8 – 25)
    if (t > 21.8) {
      var e = ease(seg(t, 21.8, 22.3));
      g.save(); g.globalAlpha = e;
      logoRing(540, 700, 150, ease(seg(t, 21.9, 23)), 30);
      g.textAlign = 'center'; g.fillStyle = CREAM; g.font = '800 92px ' + SANS; g.fillText('Ace 360', 540, 1010);
      g.font = '600 30px ' + MONO; g.fillStyle = MUTED; g.fillText('S E R V I C E S', 540, 1062);
      rich('Websites that *earn*.', 540, 1200, 68, CREAM); g.textAlign = 'center';
      g.font = '500 36px ' + SANS; g.fillStyle = MUTED; g.fillText('Netherlands-based · building worldwide', 540, 1262);
      var p = ease(seg(t, 22.8, 23.3));
      g.globalAlpha = e * p; rr(140, 1340, 800, 112, 56); g.fillStyle = OR; g.fill();
      g.fillStyle = '#111'; g.font = '700 40px ' + SANS; g.fillText('Comment “WEBSITE” for your price', 540, 1410);
      g.globalAlpha = e * ease(seg(t, 23.2, 23.7)); g.fillStyle = CREAM; g.font = '600 34px ' + MONO; g.fillText('ace360services.nl', 540, 1520);
      g.restore(); g.textAlign = 'left';
    }
  }

  function ready() {
    var fonts = Promise.all(['700 40px "Inter Variable"', 'italic 400 40px "EB Garamond"', '600 20px "JetBrains Mono Variable"'].map(function (f) { return document.fonts.load(f); }));
    var photos = new Promise(function (res) { P.onPhotos(res); });
    return Promise.all([fonts, photos]).then(function () { return new Promise(function (r) { setTimeout(r, 300); }); });
  }
  window.REEL = { draw: draw, ready: ready, duration: T_END, frame: function (t, q) { draw(t); return cv.toDataURL('image/jpeg', q || 0.92); } };
})();
</script>
</body>
</html>
