<!doctype html>
<!-- Blog images: a site screen in a browser window, optionally with a phone in front.
     shot.html?screen=work-noor|search|checkout|old|quote|design|build|results|call&phone=noor (a site design) | f:old (a film phone screen)&lang=nl|en&mood=warm&url=…
     Rendered by render-shots.js (shots.txt) into wordpress-theme/ace360/assets/img/blog-media/. -->
<html data-theme="night"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter Variable";font-weight:100 900;src:url(../../wordpress-theme/ace360/assets/fonts/inter-latin-wght-normal.woff2) format("woff2-variations")}
@font-face{font-family:"JetBrains Mono Variable";font-weight:100 800;src:url(../../wordpress-theme/ace360/assets/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2-variations")}
@font-face{font-family:"EB Garamond";font-style:italic;font-weight:400;src:url(../../wordpress-theme/ace360/assets/fonts/eb-garamond-latin-400-italic.woff2) format("woff2")}
html,body{margin:0;background:#000}
#art{position:relative;width:1600px;height:1000px;overflow:hidden;background:radial-gradient(900px 700px at 85% 10%,rgba(255,110,20,.42),transparent 70%),radial-gradient(800px 600px at 0% 100%,rgba(255,90,10,.22),transparent 70%),#0d0a08}
.win{position:absolute;left:90px;top:90px;width:1180px;border-radius:22px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px rgba(255,200,150,.18);background:#fff}
.bar{height:46px;background:#f1efec;display:flex;align-items:center;gap:9px;padding:0 18px;font:500 16px "JetBrains Mono Variable",monospace;color:#777}
.bar i{width:13px;height:13px;border-radius:50%;background:#ddd}.bar i:nth-child(1){background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar span{margin-left:auto;margin-right:auto;background:#fff;border-radius:999px;padding:5px 26px}
.win canvas{display:block;width:1180px;height:737.5px}
.phone{position:absolute;right:110px;bottom:-60px;width:330px;border-radius:46px;padding:12px;background:#1b1c20;box-shadow:0 40px 90px rgba(0,0,0,.7);transform:rotate(4deg)}
.phone canvas{display:block;width:330px;height:678px;border-radius:36px}
.solo .win{left:210px;top:120px;width:1180px}
.phoneonly .win{display:none}.phoneonly .phone{right:auto;left:635px;bottom:auto;top:90px;transform:rotate(-3deg)}
</style></head><body>
<div id="art"><div class="win"><span id="url" hidden></span><canvas id="scr" width="1024" height="640"></canvas></div>
<div class="phone" id="ph"><canvas id="pho" width="360" height="740"></canvas></div></div>
<canvas id="stage" style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0"></canvas>
<script>
var q=new URLSearchParams(location.search);
document.documentElement.setAttribute('data-lang', q.get('lang')||'nl');
window.requestAnimationFrame=function(){return 0;};
</script>
<script src="../../wordpress-theme/ace360/assets/vendor/three.min.js"></script>
<script src="../../wordpress-theme/ace360/assets/js/screens.js"></script>
<script src="../../wordpress-theme/ace360/assets/js/film.js"></script>
<script>
var P=window.ACE360_PAINT, F=window.ACE360_FILM, s=q.get('screen')||'', ph=q.get('phone')||'', mood=q.get('mood')||'warm';
if(!s) document.getElementById('art').classList.add('phoneonly');
if(!ph){ document.getElementById('ph').style.display='none'; document.getElementById('art').classList.add('solo'); }
document.getElementById('url').textContent=q.get('url')||'';
function draw(){
  var c=document.getElementById('scr'), g=c.getContext('2d');
  if(s.indexOf('work-')===0){ P.screenMood(s.slice(5),mood,g,1024,640); } else if(s){ F.screenAt(c,s); }
  if(ph){ var p=document.getElementById('pho'), pg=p.getContext('2d');
    if(ph.indexOf('f:')===0) F.phoneAt(p,ph.slice(2)); else P.phoneMood(ph,mood,pg,360,740); }
}
document.fonts.ready.then(function(){ P.onPhotos(function(){ setTimeout(function(){ draw(); setTimeout(function(){ draw(); window.SHOT_READY=true; },300); },200); }); });
</script>
</body></html>
